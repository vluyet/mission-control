name: CI

on:
  push:
  pull_request:

jobs:
  app-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI env
        run: |
          cp .env.example .env.ci
          printf '\nDB_PORT=5433\n' >> .env.ci

      - name: Start stack
        run: docker compose --env-file .env.ci up -d --build --wait db app

      - name: Reset database
        run: docker compose --env-file .env.ci exec -T app npm run db:reset

      - name: Migration check
        run: docker compose --env-file .env.ci exec -T app npm run test:migrations

      - name: Smoke and activity tests
        run: docker compose --env-file .env.ci exec -T app npm run test

      - name: Production build
        run: docker compose --env-file .env.ci exec -T app npm run build

      - name: Stop stack
        if: always()
        run: |
          docker compose --env-file .env.ci down -v
          rm -f .env.ci
