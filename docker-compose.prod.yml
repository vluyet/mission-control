services:
  app:
    build:
      context: ./app
      target: release
    depends_on:
      db:
        condition: service_healthy
      openclaw-proxy:
        condition: service_started
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      NEXT_DIST_DIR: .next-build
      MISSION_CONTROL_COMMIT: ${MISSION_CONTROL_COMMIT:-unknown}
    ports:
      - "${APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  openclaw-proxy:
    image: alpine/socat
    command: ["TCP-LISTEN:18790,fork,reuseaddr,bind=0.0.0.0", "TCP:host.docker.internal:18789"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  app_storage:
